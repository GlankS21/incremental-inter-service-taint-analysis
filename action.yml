name: DeltaTaint
description: Incremental taint analysis across Spring Cloud microservices; re-analyses only changed services, reports SARIF.
author: GlankS21
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Project root (the Maven multi-module build), relative to the workspace.
    default: .
  config:
    description: vkr-taint.yml, relative to the workspace (default <path>/vkr-taint.yml, else everything detected).
    default: ''
  services:
    description: Analyse only these services (comma-separated).
    default: ''
  gate:
    description: Fail on a finding that the baseline does not have, or on a service whose analysis failed.
    default: 'true'
  heap:
    description: Micans heap (the 16 GB GitHub-hosted runner leaves about 12g).
    default: 12g
  upload-sarif:
    description: Upload the SARIF to GitHub code scanning (needs permissions security-events write).
    default: 'true'
  baseline-branch:
    description: Pushes to this branch store their report as the baseline that pull requests are compared with.
    default: ${{ github.event.repository.default_branch }}

outputs:
  findings:
    description: Number of findings (chains of one entry point and sink method).
    value: ${{ steps.run.outputs.findings }}
  chains:
    description: Number of chains to a sink.
    value: ${{ steps.run.outputs.chains }}
  new:
    description: Number of findings that the baseline does not have.
    value: ${{ steps.run.outputs.new }}
  sarif:
    description: Path of the SARIF file.
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: composite
  steps:
    # The image builds Micans from its published source (AGPL-3.0, Zenodo 10.5281/zenodo.15050505); the
    # layers are cached in the Actions cache, so the build runs once per change of the tool.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ github.action_path }}/analysis
        tags: vkr-taint:action
        load: true
        cache-from: type=gha,scope=vkr-taint-image
        cache-to: type=gha,mode=max,scope=vkr-taint-image

    # analysis cache: the run and summary results only (work/cache, content-addressed, about 1 MB a
    # service), so the newest one of any earlier run is safe to reuse; the per-service workdirs
    # (classes and library jars, hundreds of MB) are rebuilt from the build output in seconds
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vkr-cache/cache
        key: vkr-taint-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vkr-taint-cache-
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'pull_request'
      with:
        path: ${{ runner.temp }}/vkr-baseline
        key: vkr-taint-baseline-${{ github.event.pull_request.base.sha }}
        restore-keys: vkr-taint-baseline-

    - id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SERVICES: ${{ inputs.services }}
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_HEAP: ${{ inputs.heap }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        out="$RUNNER_TEMP/vkr-out"
        mkdir -p "$out" "$RUNNER_TEMP/vkr-cache" "$RUNNER_TEMP/vkr-baseline"
        args=("/repo/$INPUT_PATH" --build none --out /out)
        [ -n "$INPUT_CONFIG" ] && args+=(--config "/repo/$INPUT_CONFIG")
        [ -n "$INPUT_SERVICES" ] && args+=(--services "$INPUT_SERVICES")
        if [ -f "$RUNNER_TEMP/vkr-baseline/report.json" ]; then
          args+=(--baseline /baseline/report.json)
          [ "$INPUT_GATE" = true ] && args+=(--gate)
        else
          echo "::notice::no baseline report yet: findings are listed but not compared"
          args+=(--no-gate)
        fi
        code=0
        docker run --rm -e VKR_HEAP="$INPUT_HEAP" \
          -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/vkr-cache:/cache" \
          -v "$RUNNER_TEMP/vkr-baseline:/baseline:ro" -v "$out:/out" \
          vkr-taint:action "${args[@]}" || code=$?
        # the container runs as root: give the runner user the files the next steps read and cache
        sudo chown -R "$(id -u):$(id -g)" "$out" "$RUNNER_TEMP/vkr-cache"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # keyed by the cached entries: a run that adds none saves nothing
        if [ -d "$RUNNER_TEMP/vkr-cache/cache" ]; then
          key=$(cd "$RUNNER_TEMP/vkr-cache/cache" && find . -type f | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "cache-key=vkr-taint-cache-$key" >> "$GITHUB_OUTPUT"
        fi
        echo "sarif=$out/vkr-taint.sarif" >> "$GITHUB_OUTPUT"
        [ -f "$out/vkr-taint.sarif" ] && echo "has-sarif=true" >> "$GITHUB_OUTPUT"
        if [ -f "$out/vkr-taint-report.json" ]; then
          python3 - "$out/vkr-taint-report.json" <<'EOF'
        import json, os, sys
        r = json.load(open(sys.argv[1], encoding='utf-8'))
        new = len(r.get('newFindings', r.get('new', [])))
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            print(f"findings={len(r.get('findings', r['chains']))}", file=f)
            print(f"chains={len(r['chains'])}", file=f)
            print(f"new={new}", file=f)
        if r.get('toolChanged'):
            print(f"::warning::vkr-taint: the baseline was made by another version of DeltaTaint: the {new} new "
                  "finding(s) may come from the tool and do not fail the gate; the next push to the baseline branch "
                  "stores a baseline of this version")
        EOF
          python3 "$GITHUB_ACTION_PATH/analysis/taint/scripts/report_md.py" "$out/vkr-taint-report.json" \
            --sarif "$out/vkr-taint.sarif" --blob "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$HEAD_SHA" \
            >> "$GITHUB_STEP_SUMMARY" || true
        fi

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always() && steps.run.outputs.cache-key != '' && steps.run.outputs.cache-key != steps.cache.outputs.cache-matched-key
      with:
        path: ${{ runner.temp }}/vkr-cache/cache
        key: ${{ steps.run.outputs.cache-key }}

    # saved from the path that pull requests restore it to: a cache is found only under the same path
    - name: Store the baseline
      if: github.event_name == 'push' && github.ref_name == inputs.baseline-branch && steps.run.outputs.code == '0'
      shell: bash
      run: cp "$RUNNER_TEMP/vkr-out/vkr-taint-report.json" "$RUNNER_TEMP/vkr-baseline/report.json"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'push' && github.ref_name == inputs.baseline-branch && steps.run.outputs.code == '0'
      with:
        path: ${{ runner.temp }}/vkr-baseline
        key: vkr-taint-baseline-${{ github.sha }}

    - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      if: always() && inputs.upload-sarif == 'true' && steps.run.outputs.has-sarif == 'true'
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: vkr-taint

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: vkr-taint-report
        path: ${{ runner.temp }}/vkr-out
        if-no-files-found: ignore

    - name: Gate
      if: steps.run.outputs.code != '0'
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.code }}
        NEW: ${{ steps.run.outputs.new }}
      run: |
        case "$CODE" in
          1) echo "::error::vkr-taint: $NEW new finding(s), see the job summary and code scanning";;
          2) echo "::error::vkr-taint: a service could not be analysed, its chains are missing";;
          *) echo "::error::vkr-taint failed (exit $CODE)";;
        esac
        exit 1
