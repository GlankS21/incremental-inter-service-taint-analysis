# Version updates of the tool's own dependencies (the ecommerce testbed is left as it is: its
# versions are part of the experiments). Actions are pinned to SHAs; Dependabot bumps the SHA and
# the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions   # .github/workflows and action.yml
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: maven
    directory: /analysis/channel-extractor
    schedule: { interval: weekly }
    groups:
      channel-extractor: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /analysis
    schedule: { interval: weekly }
    # the JDK of each stage is a choice, not a version to follow: Micans' Gradle toolchain needs 17,
    # the channel-extractor is built with 21, the analysis runs on 24; a new JDK is tested by hand
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: maven   # its tags carry the JDK (3.9.9-eclipse-temurin-21)
