# Incremental inter-service taint analysis of the testbed (ecommerce/backend) with the vkr-taint action
# of this repository (action.yml): only services whose analysis inputs changed are re-analysed, the
# chains to a sink go to code scanning, and a pull request fails when it adds a chain that the master
# baseline does not have. Runs on a GitHub-hosted runner; the analysis cache is kept in the Actions cache.
name: Taint analysis

on:
  push:
    branches: [master]
    paths: [ecommerce/backend/**, analysis/**, action.yml, .github/workflows/taint.yml]
  pull_request:
    paths: [ecommerce/backend/**, analysis/**, action.yml, .github/workflows/taint.yml]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF upload to code scanning
  actions: read

concurrency:
  group: vkr-taint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  taint:
    name: Incremental taint analysis
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the services
        working-directory: ecommerce/backend
        run: sh mvnw -B -ntp -DskipTests -pl cart-service,order-service,inventory-service,payment-service -am package

      - uses: ./
        with:
          path: ecommerce/backend
          config: analysis/taint/config/ecommerce.vkr-taint.yml
          # a pull request from a fork gets no security-events permission: its report stays an artifact
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
