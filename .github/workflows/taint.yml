# Incremental inter-service taint analysis of the testbed (ecommerce/backend) with the vkr-taint action
# of this repository (action.yml): only services whose analysis inputs changed are re-analysed, the
# chains to a sink go to code scanning, and a pull request fails when it adds a chain that the main
# baseline does not have. Runs on a GitHub-hosted runner; the analysis cache is kept in the Actions cache.
name: Taint analysis

on:
  push:
    branches: [main]
    paths: [ecommerce/backend/**, analysis/**, action.yml, .github/workflows/taint.yml]
  pull_request:
    paths: [ecommerce/backend/**, analysis/**, action.yml, .github/workflows/taint.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkr-taint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests of the tool
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Scripts
        run: |
          python3 -I -m unittest discover -s analysis/taint/tests -p "test_*.py"
          python3 -I -m unittest discover -s analysis/experiments -p "test_*.py"

      # the launcher plugin tests (analysis/taint/launcher/test/run_tests.py) compile against the Micans
      # jar, which only the tool image builds: they run locally with MICANS_JAR set

      - name: Channel extractor
        working-directory: analysis/channel-extractor
        run: sh mvnw -B -ntp test

  taint:
    name: Incremental taint analysis
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the services
        working-directory: ecommerce/backend
        run: sh mvnw -B -ntp -DskipTests -pl cart-service,order-service,inventory-service,payment-service -am package

      - uses: ./
        with:
          path: ecommerce/backend
          config: analysis/taint/config/ecommerce.vkr-taint.yml
          # a pull request from a fork gets no security-events permission: its report stays an artifact
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
