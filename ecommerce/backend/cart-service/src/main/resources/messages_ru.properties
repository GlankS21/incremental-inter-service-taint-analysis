# Тексты cart-service: сообщения API и сообщения об ошибках.
# Аргумент вида {n,choice,0#...|1#...|2#...} - категория множественного числа числа (RussianPlural).
cart.item-added=Товар добавлен в корзину
cart.updated=Корзина обновлена
cart.item-removed=Товар удалён из корзины
cart.cleared=Корзина очищена

# {0} - предел, {1} - его категория
cart.error.too-many-products=В корзине может быть не больше {0} {1,choice,0#разного товара|1#разных товаров|2#разных товаров}
cart.error.quantity-limit=Одного товара можно положить в корзину не больше {0} {1,choice,0#штуки|1#штук|2#штук}
cart.error.product-not-available=Этот товар сейчас не продаётся
# {0} - название товара
cart.error.out-of-stock=Товара «{0}» нет в наличии
# {0} - название товара, {1} - доступное количество, {2} - его категория
cart.error.insufficient-stock=Товара «{0}» в наличии только {1} {2,choice,0#штука|1#штуки|2#штук}
cart.error.not-in-cart=Этого товара нет в корзине
cart.error.catalogue-unavailable=Каталог товаров временно недоступен, повторите попытку позже
cart.error.catalogue-no-data=Каталог товаров не вернул данные, повторите попытку позже
cart.error.stock-unavailable=Сведения о наличии товаров временно недоступны
